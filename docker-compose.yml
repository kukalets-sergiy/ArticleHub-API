version: "3.9"

services:
  web:
    build: .
    container_name: articlehub_web
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&gunicorn articlehub_core.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    restart: always
    volumes:
      - .:/code
      - ./logs:/code/logs


  mongo:
    image: mongo:7.0
    container_name: articlehub_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"

  mongo_test:
    image: mongo:7.0
    container_name: articlehub_mongo_test
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27018:27017"

  redis:
    image: redis:7.2-alpine
    container_name: articlehub_redis
    restart: always
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: articlehub_celery
    command: sh -c "sleep 10 && celery -A articlehub_core worker -l info"
    env_file:
      - .env
    depends_on:
      - web
      - redis
    restart: always
    volumes:
      - .:/code
      - ./logs:/code/logs

  celery-beat:
    build: .
    container_name: articlehub_celery_beat
    command: celery -A articlehub_core beat -l info
    env_file:
      - .env
    depends_on:
      - web
      - redis
    restart: always
    volumes:
      - .:/code
      - ./logs:/code/logs

  test:
    build: .
    command: >
      sh -c "pytest"
    env_file:
      - .env.test
    depends_on:
      - mongo_test
    volumes:
      - .:/code
