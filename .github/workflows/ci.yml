name: CI

on:
  push:
    branches: [ main, dev, prod, testing, testing2 ]
  pull_request:
    branches: [ main, dev, prod, testing, testing2 ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare env
        run: cp .env.test .env
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install docker-compose -y
      - name: Build and run tests
        run: |
          docker-compose build
          docker-compose up -d mongo_test redis
          sleep 10
          docker-compose run --rm test