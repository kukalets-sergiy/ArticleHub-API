version: "3.9"
services:
  web:
    build: .
    container_name: articlehub_web
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn articlehub_core.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    restart: always
    env_file:
      - .env.prod
    volumes:
      - .:/code
      - ./logs:/code/logs
      - static_volume:/code/collected_static
      - media_volume:/code/media

  redis:
    image: redis:7.2-alpine
    container_name: articlehub_redis
    restart: always
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: articlehub_celery
    command: sh -c "sleep 10 && celery -A articlehub_core worker -l info"
    restart: always
    env_file:
      - .env.prod
    volumes:
      - .:/code
      - ./logs:/code/logs
    depends_on:
      - web
      - redis

  celery-beat:
    build: .
    container_name: articlehub_celery_beat
    command: celery -A articlehub_core beat -l info
    restart: always
    env_file:
      - .env.prod
    volumes:
      - .:/code
      - ./logs:/code/logs
    depends_on:
      - web
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: articlehub_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt
      - /tmp/acme-challenge:/tmp/acme-challenge
      - static_volume:/code/collected_static
      - media_volume:/code/media
    depends_on:
      - web
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /tmp/acme-challenge:/tmp/acme-challenge
    entrypoint: ""
    command: sh -c "certbot certonly --webroot -w /tmp/acme-challenge/ -d lightray.live --text --agree-tos --email kukaletsserhiy@gmail.com --rsa-key-size 4096 --verbose --keep-until-expiring --preferred-challenges=http"
    depends_on:
      - nginx

volumes:
  static_volume:
  media_volume:
